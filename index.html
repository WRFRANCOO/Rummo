<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rummo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Rummo · Finanças pessoais</title>
<style>
:root{
  --bg:#F2F6F7; --card:#FFFFFF; --ink:#1B2B30; --muted:#5A6E73; --line:#D9E3E5; --soft:#E8F0F1;
  --brand:#1F4E5F; --action:#2F7A78; --on-action:#FFFFFF;
  --ok:#2E6B47; --okbg:#E3F1E8; --okbar:#4E9F6E;
  --warn:#7A5210; --warnbg:#FBF1DF; --warnbar:#C98B2B;
  --crit:#7E3524; --critbg:#F8E6E0; --critbar:#B5543C;
  --radius:10px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C20; --card:#16272C; --ink:#E3EEF0; --muted:#8FA7AD; --line:#22393F; --soft:#1B3035;
    --brand:#8CC4CF; --action:#5FB3AE; --on-action:#0F1C20;
    --ok:#8FD1A6; --okbg:#1B3325; --okbar:#6DBB8A;
    --warn:#E9C27A; --warnbg:#33280F; --warnbar:#D9A54A;
    --crit:#EBA592; --critbg:#3A1E17; --critbar:#D07A62;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C20; --card:#16272C; --ink:#E3EEF0; --muted:#8FA7AD; --line:#22393F; --soft:#1B3035;
  --brand:#8CC4CF; --action:#5FB3AE; --on-action:#0F1C20;
  --ok:#8FD1A6; --okbg:#1B3325; --okbar:#6DBB8A;
  --warn:#E9C27A; --warnbg:#33280F; --warnbar:#D9A54A;
  --crit:#EBA592; --critbg:#3A1E17; --critbar:#D07A62;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.num,.money{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}

/* Layout */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.brand{font-size:1.35rem;font-weight:650;letter-spacing:-.01em;color:var(--brand);padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.brand .mark{width:22px;height:22px;border-radius:50%;border:3px solid var(--action);position:relative}
.brand .mark::after{content:"";position:absolute;left:50%;top:-6px;width:3px;height:10px;background:var(--action);transform:translateX(-50%) rotate(35deg);transform-origin:bottom}
.nav-i{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
.nav-i:hover{background:var(--soft);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--soft);color:var(--brand);font-weight:650}
.side .spacer{flex:1}
.side .foot{font-size:.8rem;color:var(--muted);padding:8px 12px;line-height:1.4}
main{padding:calc(20px + env(safe-area-inset-top,0px)) 28px calc(40px + env(safe-area-inset-bottom,0px));max-width:1080px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:.9rem}
.topbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.bottom{display:none}
.fab{display:none}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .topbar h1{font-size:1.3rem}
  .topbar .acts .hide-m{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .bottom button{border:0;background:none;padding:8px 2px;font-size:.78rem;color:var(--muted);font-weight:500;cursor:pointer;border-radius:8px}
  .bottom button[aria-current="page"]{color:var(--brand);font-weight:700;background:var(--soft)}
  .bottom .plus{font-size:1.6rem;line-height:1;color:var(--on-action);background:var(--action);border-radius:14px;margin:0 8px;font-weight:400}
}

/* Blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:1.02rem;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.card h2 .r{margin-left:auto;font-weight:400;font-size:.88rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-bottom:14px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.metric .l{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.metric .v{font-size:1.35rem;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.metric .s{font-size:.8rem;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pos{color:var(--ok)} .neg{color:var(--crit)}

/* Hero */
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
:root[data-theme="dark"] .hero{background:#1A3A45}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:#1A3A45}}
.hero .hello{margin:0 0 4px;opacity:.85;font-size:.92rem}
.hero .line{margin:0;font-size:clamp(1.3rem,3.2vw,1.9rem);line-height:1.2;font-weight:600;letter-spacing:-.015em;max-width:26ch}
.hero .facts{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;opacity:.95}
.hero .facts b{font-variant-numeric:tabular-nums}
.score{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.35);position:relative}
.score .n{font-size:2.1rem;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.score .t{font-size:.72rem;opacity:.85;line-height:1.2}
.score .q{position:absolute;right:-4px;top:-4px;background:#fff;color:var(--brand)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.score{width:92px;height:92px}.score .n{font-size:1.7rem}}

/* Rummo line */
.track{display:flex;gap:0;overflow-x:auto;padding:6px 2px 4px;scroll-snap-type:x proximity}
.stop{min-width:170px;flex:0 0 auto;position:relative;padding:22px 14px 4px 0;scroll-snap-align:start}
.stop::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--line)}
.stop::after{content:"";position:absolute;top:2px;left:0;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--action)}
.stop.now::after{background:var(--action)}
.stop.meta::after{border-color:var(--warnbar)}
.stop .m{font-weight:650;font-size:.92rem}
.stop .d{font-size:.84rem;color:var(--muted);line-height:1.35}
.stop .v{font-size:.86rem;color:var(--ok);font-weight:600}

/* Alerts / banners */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:.92rem;line-height:1.45}
.alert .bar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto}
.alert .tx{flex:1}
.alert button{flex:0 0 auto}
.alert.crit{background:var(--critbg);color:var(--crit)} .alert.crit .bar{background:var(--critbar)}
.alert.warn{background:var(--warnbg);color:var(--warn)} .alert.warn .bar{background:var(--warnbar)}
.alert.ok{background:var(--okbg);color:var(--ok)} .alert.ok .bar{background:var(--okbar)}
.alert.info{background:var(--soft);color:var(--ink)} .alert.info .bar{background:var(--action)}
.banner{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.92rem}
.banner .tx{flex:1 1 260px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:550;font-size:.92rem;white-space:nowrap}
.btn:hover{border-color:var(--action)}
.btn.pri{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--action);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.danger{color:var(--crit);border-color:var(--critbar)}
.q{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer;display:inline-grid;place-items:center;padding:0;line-height:1;vertical-align:middle}
.q:hover{color:var(--action);border-color:var(--action)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:550;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--brand);box-shadow:0 0 0 1px var(--line)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .lb{min-width:150px;text-align:center;font-weight:600;display:inline-block}
.monthnav .lb::first-letter,.stop .m::first-letter{text-transform:uppercase}

/* Lists */
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--soft)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.faded{opacity:.55}
.dayhead{font-size:.8rem;color:var(--muted);padding:10px 2px 6px;font-weight:600}
.dayhead::first-letter{text-transform:uppercase}
.pill{font-size:.74rem;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.crit{background:var(--critbg);color:var(--crit)} .pill.info{background:var(--soft);color:var(--muted)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--okbar);border-radius:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:550;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--card)}

/* Stamp */
.stamp-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.stamp{width:150px;height:150px;border-radius:50%;border:4px double var(--action);display:grid;place-items:center;text-align:center;color:var(--action);transform:rotate(-8deg);padding:10px}
.stamp.off{border-color:var(--line);color:var(--muted)}
.stamp .k{font-size:.72rem;font-weight:700;letter-spacing:.06em}
.stamp .d{font-size:1.5rem;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.stamp .h{font-size:.78rem}
@media (max-width:560px){.stamp-wrap{grid-template-columns:1fr;justify-items:center;text-align:center}.stamp{width:130px;height:130px}}
.facts-list{margin:0;padding:0;list-style:none}
.facts-list li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.facts-list li:last-child{border-bottom:0}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,22,26,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px 16px;border:1px solid var(--line)}
.sheet.wide{width:min(760px,100%)}
.sheet h3{margin:0 0 4px;font-size:1.15rem}
.sheet .intro{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;position:sticky;bottom:-16px;background:var(--card);padding:10px 0 4px}
.sheet .foot .l{margin-right:auto}
@media (max-width:860px){.ov{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.fld label{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted);font-weight:550;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-height:40px}
.fld input:focus,.fld select:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--action) 25%,transparent)}
.fld small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px;line-height:1.35}
.fld .err{color:var(--crit);font-size:.8rem;margin-top:3px}
.fld.big input{font-size:1.5rem;font-weight:650;padding:10px 12px;font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:.92rem}
.switch input{width:20px;height:20px;accent-color:var(--action)}
details.more{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;color:var(--action);font-weight:550;font-size:.9rem}
details.more .form{margin-top:10px}

/* Onboarding */
.onb{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.onb .box{max-width:560px;margin:0 auto}
.onb h2{font-size:clamp(1.5rem,5vw,2rem);line-height:1.15;letter-spacing:-.02em;margin:10px 0 10px;color:var(--brand)}
.onb p{line-height:1.6}
.onb .steps{display:flex;gap:6px;margin-bottom:8px}
.onb .steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.onb .steps i.on{background:var(--action)}
.onb .promise{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.onb .promise div{padding:4px 0}
.onb .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.conf{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.conf .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.conf label{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem;cursor:pointer;display:flex;gap:8px}
@media (max-width:480px){.conf .opts{grid-template-columns:1fr}}

/* Fase 2A */
.acao{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.acao:first-of-type{border-top:0}
.acao .n{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.86rem;background:var(--soft);color:var(--brand)}
.acao.crit .n{background:var(--critbg);color:var(--crit)} .acao.warn .n{background:var(--warnbg);color:var(--warn)} .acao.ok .n{background:var(--okbg);color:var(--ok)}
.acao .c{flex:1;min-width:0}.acao .t{font-weight:600;line-height:1.35}.acao .m{font-size:.86rem;color:var(--muted);margin-top:2px;line-height:1.45}
.livre{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--okbg);color:var(--ok);font-size:.92rem}
.trilha{list-style:none;margin:0;padding:0;counter-reset:t}
.trilha li{display:flex;gap:12px;padding:9px 0;position:relative}
.trilha li:not(:last-child)::before{content:"";position:absolute;left:13px;top:36px;bottom:-4px;width:2px;background:var(--line)}
.trilha .dot{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;border:2px solid var(--line);background:var(--card);color:var(--muted);position:relative;z-index:1}
.trilha li.ok .dot{background:var(--okbar);border-color:var(--okbar);color:#fff}
.trilha li.atual .dot{border-color:var(--action);color:var(--action)}
.trilha li.atual b{color:var(--brand)}
.trilha li.pend{opacity:.7}
.negs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.negcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.negcard .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.negcard .t{font-weight:650}.negcard .s{font-size:.82rem;color:var(--muted)}
.negcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .opt{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.9rem;display:grid;gap:3px}
.cmp .opt span{color:var(--muted);font-size:.82rem}
.cmp .opt.on{border-color:var(--action);box-shadow:0 0 0 1px var(--action)}
@media (max-width:480px){.cmp{grid-template-columns:1fr}}
details.dir{border-top:1px solid var(--line);padding:9px 0}
details.dir:first-of-type{border-top:0}
details.dir summary{cursor:pointer;font-weight:600;font-size:.94rem}
details.dir p{margin:6px 0 0;line-height:1.55;color:var(--muted)}

.rec-row{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr) 150px;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.rec-row:first-child{border-top:0}
@media (max-width:640px){.rec-row{grid-template-columns:1fr 1fr}}
.card.saldos{border-color:var(--action)}

/* iPhone: evita zoom automático ao tocar nos campos */
@media (max-width:860px){.fld input,.fld select,input,select,textarea{font-size:16px}}

.sdrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.sdrow .switch{padding:10px 0}

/* Espaços e casal */
.visbar{margin:-6px 0 12px;overflow-x:auto}
.seg.visoes button{white-space:nowrap}
.btn.esp{font-weight:600;color:var(--brand)}

.t-sm{display:none}
@media (max-width:860px){.t-lg{display:none}.t-sm{display:inline}.topbar .acts .btn{padding:7px 10px;font-size:.84rem}}
.passos{margin:10px 0 0;padding-left:18px;color:var(--muted);line-height:1.5}
.passos li{margin-bottom:4px}
.passos b{color:var(--ink)}

.legenda{display:flex;gap:16px;font-size:.82rem;color:var(--muted);margin-top:4px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* Saldos nos lançamentos */
.saldos-faixa{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;scroll-snap-type:x proximity}
.sconta{flex:0 0 auto;min-width:150px;max-width:220px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;scroll-snap-align:start}
.sconta:hover{border-color:var(--action)}
.sconta .n{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sconta .v{font-size:1.15rem;font-weight:650}
.sconta .s{font-size:.74rem;color:var(--muted)}
.facts-list.prev{background:var(--soft);border-radius:10px;padding:6px 10px}
/* Celular: nada passa da largura da tela */
main{min-width:0}
.topbar{flex-wrap:wrap}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar .acts{width:100%}
  .seg{flex-wrap:wrap}
  .monthnav .lb{min-width:0;flex:1}
  .row{flex-wrap:wrap}
  .row .main{flex:1 1 150px}
  .hero{padding:18px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .metric{padding:10px 12px}
  .metric .v{font-size:1.1rem}
  .seg button{padding:6px 10px}
}

/* Versão do app */
.versao-lat{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.lnk{border:0;background:none;padding:0;color:var(--action);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.rodape-versao{display:none;text-align:center;font-size:.78rem;color:var(--muted);margin-top:22px;padding-top:12px;border-top:1px solid var(--line)}
@media (max-width:860px){.rodape-versao{display:block}}
</style>
</head>

</nav>

function novoEstado(){
  var s={meta:{app:APP,versao_esquema:VERSAO,criado_em:nowIso(),inicio:hoje(),ultima_alteracao:'',ultima_exportacao:'',ultima_importacao:'',onboarding_ok:false,espaco_tipo:ehCasal()?'casal':'individual',espaco_id:ehCasal()?uid('ESP'):'principal'},premissas:premissasPadrao()};
  COLS.forEach(function(c){s[c]=[];});

function migrar(){
  if(!S.meta) S.meta=novoEstado().meta;
  if(!S.premissas) S.premissas=premissasPadrao();
  COLS.forEach(function(c){if(!Array.isArray(S[c]))S[c]=[];});
  (S.dividas||[]).forEach(function(d){if(d.tipo==='Acordo ou renegociação')d.tipo='Acordo em andamento';});
  if(!S.meta.espaco_tipo)S.meta.espaco_tipo=ehCasal()?'casal':'individual';
  if(!S.meta.espaco_id)S.meta.espaco_id=ehCasal()?uid('ESP'):'principal';
  S.meta.versao_esquema=VERSAO;
}
function carregar(){
  try{var raw=localStorage.getItem(lsKey());S=raw?JSON.parse(raw):novoEstado();}
  catch(e){S=novoEstado();storageOk=false;}
  migrar();
}
function persistir(){try{localStorage.setItem(lsKey(),JSON.stringify(S));}catch(e){storageOk=false;}}
function live(col){var a=(S[col]||[]).filter(function(r){return !r.excluido;});var v=visao();if(v!=='tudo'&&PLAN_COLS[col])a=a.filter(function(r){return donoRec(col,r)===v;});return a;}
function byId(col,id){return (S[col]||[]).find(function(r){return r.id===id;});}
function salvarRec(col,rec){
  var t=nowIso();rec.atualizado_em=t;
  if(!rec.id){rec.id=uid((SCHEMA[col]&&SCHEMA[col].pref)||col.slice(0,2).toUpperCase());rec.criado_em=t;S[col].push(rec);}
  else{var i=S[col].findIndex(function(r){return r.id===rec.id;});if(i>-1)S[col][i]=rec;else{rec.criado_em=rec.criado_em||t;S[col].push(rec);}}
  return rec;
}
function excluirRec(col,id){var r=byId(col,id);if(r){r.excluido=true;r.atualizado_em=nowIso();}}

  S.meta.ultima_alteracao=nowIso();
  carimbarHoje();
  atualizarRetrato();
  persistir();render();

}

/* ---------- cheque especial derivado da conta ---------- */
function sinalSaldo(v){var x=Number(v.saldo_inicial)||0;return (v.tipo!=='cartao'&&(v.negativo||x<0))?-Math.abs(x):Math.abs(x);}
function chequesEspeciais(){
  return live('contas').filter(function(c){return c.tipo!=='cartao'&&saldoConta(c)<0;}).map(function(c){
    var v=Math.abs(saldoConta(c)),est=!(Number(c.juros_cheque)>0),j=est?8:Number(c.juros_cheque);
    return {c:c,valor:v,juros:j,estimado:est,custoMes:r2(v*j/100),
      d:{id:'CE-'+c.id,credor:c.nome+' (cheque especial)',tipo:'Cheque especial',juros_mes:j,saldo_devedor:v,parcela:0,virtual:true,conta_id:c.id}};
  });
}
/* ---------- saldos e previstos ---------- */
function saldoConta(c){
  var s=Number(c.saldo_inicial)||0; if(c.tipo==='cartao') s=-s;
  var ini=c.data_saldo||'0000-00-00', def=c.saldo_definido_em||'', h=hoje();
  live('lancamentos').forEach(function(l){
    if(l.data>h||l.data<ini)return;
    if(l.data===ini && def && (l.criado_em||'')<def)return;
    var v=Number(l.valor)||0;
    if(l.tipo==='entrada'&&l.conta_id===c.id)s+=v;
    else if(l.tipo==='saida'&&l.conta_id===c.id)s-=v;
    else if(l.tipo==='transferencia'){if(l.conta_id===c.id)s-=v;if(l.conta_destino_id===c.id)s+=v;}
  });
  return r2(s);
}
function lancPorRef(ref){return live('lancamentos').find(function(l){return l.previsto_ref===ref;});}
function infoDivida(d){
  var n=Number(d.parcelas_restantes)||0, base=d.competencia_base;
  if(!n||!base)return {fim:null,restantes:null,alivio:null,pagas:0};
  var fim=addMonths(base,n-1),rest=0;
  for(var k=0;k<n;k++){if(!lancPorRef('D:'+d.id+':'+addMonths(base,k)))rest++;}
  return {fim:fim,restantes:rest,alivio:addMonths(fim,1),pagas:n-rest,total:n};
}
function itensDoMes(c){
  var it=[], mesN=Number(c.slice(5));
  live('receitas').forEach(function(r){
    if(r.frequencia==='anual'&&Number(r.mes)!==mesN)return;
    it.push({ref:'R:'+r.id+':'+c,tipo:'entrada',desc:r.descricao,categoria:r.categoria,valor:Number(r.valor)||0,data:dateInComp(c,r.dia),conta_id:r.conta_id||'',origem:'Receita fixa'});
  });
  live('despesas').forEach(function(r){
    if(r.frequencia==='anual'&&Number(r.mes)!==mesN)return;
    if(r.desde&&r.desde>c)return;
    it.push({ref:'S:'+r.id+':'+c,tipo:'saida',desc:r.descricao,categoria:r.categoria,valor:Number(r.valor)||0,data:dateInComp(c,r.dia),conta_id:r.conta_id||'',origem:'Despesa fixa'});
  });
  live('dividas').forEach(function(d){
    if(d.quitada_em)return;
    var n=Number(d.parcelas_restantes)||0;if(!n||!d.competencia_base)return;
    var k=monthsBetween(d.competencia_base,c);if(k<0||k>=n)return;
    it.push({ref:'D:'+d.id+':'+c,tipo:'saida',desc:d.credor+' · parcela '+(k+1)+' de '+n,categoria:'Dívidas e parcelas',valor:Number(d.parcela)||0,data:dateInComp(c,d.dia_vencimento),conta_id:d.conta_id||'',origem:'Dívida'});
  });
  live('contas').forEach(function(ct){
    if(ct.tipo!=='cartao'||!ct.dia_vencimento)return;
    faturasCartao(ct).forEach(function(f){
      if(compOf(f.venc)!==c||f.status==='zerada')return;
      it.push({ref:'F:'+ct.id+':'+f.id,tipo:'transferencia',desc:'Fatura '+ct.nome,categoria:'',valor:f.status==='paga'?f.total:f.restante,data:f.venc,conta_id:'',conta_destino_id:ct.id,origem:'Fatura do cartão',fat:f});
    });
  });
  it=it.concat(itensContribuicao(c));
  var h=hoje();
  it.forEach(function(i){
    var l=lancPorRef(i.ref);i.lanc=l||null;
    if(l)i.status='pago';
    else if(i.data<S.meta.inicio)i.status='antes';
    else if(i.data<h)i.status='atrasado';
    else if(daysDiff(h,i.data)<=3)i.status='breve';
    else i.status='futuro';
  });
  it.forEach(function(i){if(!i.fat)return;var f=i.fat;if(f.status==='paga')i.status='pago';else if(f.status==='aberta')i.status='aberta';else if(i.status==='pago'||i.status==='antes')i.status=f.venc<h?'atrasado':(daysDiff(h,f.venc)<=3?'breve':'futuro');});
  return it.sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:0;});
}

function calc(){
  var h=hoje(),c=compOf(h),contas=live('contas');
  var disp=sum(contas.filter(function(x){return x.tipo!=='cartao'&&x.titular!=='negocio';}),saldoConta);
  var cartoes=contas.filter(function(x){return x.tipo==='cartao';}).map(function(x){var rc=resumoCartao(x);return {c:x,uso:rc.usoLimite,devido:rc.devido,rc:rc};});
  var itens=itensDoMes(c);
  var prevEnt=sum(itens.filter(function(i){return i.tipo==='entrada';}),function(i){return i.valor;});
  var prevSai=sum(itens.filter(function(i){return i.tipo==='saida';}),function(i){return i.valor;});
  var kIt=itens.filter(function(i){return i.origem==='Contribuição';}),kTot=sum(kIt,function(i){return i.valor;});
  if(visao()==='casa')prevEnt=r2(prevEnt+kTot);else if(visao()==='A'||visao()==='B')prevSai=r2(prevSai+kTot);
  var lm=lancVis().filter(function(l){return compOf(l.data)===c&&l.data<=h;});
  var ent=sum(lm.filter(function(l){return l.tipo==='entrada';}),function(l){return l.valor;});
  var sai=sum(lm.filter(function(l){return l.tipo==='saida';}),function(l){return l.valor;});
  var naoPlan=sum(lm.filter(function(l){return l.tipo==='saida'&&!l.planejada&&!l.previsto_ref;}),function(l){return l.valor;});
  var atrasados=itens.concat(itensDoMes(addMonths(c,-1))).filter(function(i){return i.status==='atrasado'&&i.valor>0;});
  var renda=sum(live('receitas'),function(r){return r.frequencia==='anual'?(Number(r.valor)||0)/12:r.valor;});
  if(visao()==='casa'){var ctb=contribCasal(c);if(ctb&&ctb.modo!=='junto')renda=r2(ctb.a+ctb.b);}
  var parcelas=sum(itens.filter(function(i){return i.origem==='Dívida';}),function(i){return i.valor;});
  var essencial=r2(sum(live('despesas').filter(function(d){return d.classificacao==='essencial';}),function(d){return d.frequencia==='anual'?(Number(d.valor)||0)/12:d.valor;})+parcelas);
  var reserva=r2(sum(contas.filter(function(x){return x.tipo==='poupanca'&&x.titular!=='negocio';}),saldoConta)+sum(live('investimentos').filter(function(i){return i.liquidez==='Diária';}),function(i){return i.saldo;}));
  var investido=sum(live('investimentos'),function(i){return i.saldo;});
  var dividas=live('dividas').filter(dividaAtiva).map(function(d){var inf=infoDivida(d);return {d:d,inf:inf,total:Number(d.saldo_devedor)>0?Number(d.saldo_devedor):(inf.restantes!=null?r2(inf.restantes*(Number(d.parcela)||0)):Number(d.parcela)||0)};});
  var ces=chequesEspeciais();
  ces.forEach(function(ce){dividas.push({d:ce.d,inf:{restantes:null,fim:null},total:ce.valor});});
  var caras=dividas.filter(function(x){return DIVIDA_CARA.indexOf(x.d.tipo)>-1&&(x.inf.restantes==null||x.inf.restantes>0);});
  return {h:h,c:c,disp:disp,cartoes:cartoes,fatura:sum(cartoes,function(x){return x.devido;}),itens:itens,prevEnt:prevEnt,prevSai:prevSai,sobraPrev:r2(prevEnt-prevSai),
    ent:ent,sai:sai,naoPlan:naoPlan,atrasados:atrasados,renda:renda,parcelas:parcelas,essencial:essencial,reserva:reserva,investido:investido,
    mesesReserva:essencial>0?r2(reserva/essencial):null,dividas:dividas,dividaTotal:sum(dividas,function(x){return x.total;}),caras:caras,ces:ces,
    temDados:live('receitas').length+live('despesas').length+live('lancamentos').length+live('dividas').length>0,
    semReg:diasSemRegistro()};
}
function diagnostico(){
  var m=calc(),nota=100,it=[],P=S.premissas;
  function add(n,pen,tx,acao,view){nota-=pen;it.push({nivel:n,pen:pen,tx:tx,acao:acao,view:view});}
  var carasReais=m.caras.filter(function(x){return !x.d.virtual;});
  if(m.ces.length){var ce0=m.ces[0];add('crit',20,'A conta '+ce0.c.nome+' está '+brl(ce0.valor)+' no negativo (cheque especial). Os juros custam cerca de '+brl(ce0.custoMes)+' por mês'+(ce0.estimado?', numa estimativa pelo teto de 8%':'')+'. Sair do negativo vem antes de qualquer outra meta.','Ver contas','cadastro:contas');
    if(live('dividas').some(function(d){return d.tipo==='Cheque especial'&&dividaAtiva(d);}))it.push({nivel:'info',pen:0,tx:'Há uma dívida de cheque especial cadastrada à mão e uma conta no negativo. Se forem a mesma coisa, exclua a dívida manual para não contar duas vezes.',acao:'Ver dívidas',view:'dividas'});}
  if(carasReais.length){add('crit',m.ces.length?0:20,'Você tem '+plural(carasReais.length,'dívida','dívidas')+' com juros muito altos ('+carasReais.map(function(x){return x.d.tipo.toLowerCase();}).join(', ')+'). Sair dela vem antes de qualquer outra meta.','Ver dívidas','cadastro:dividas');}
  if(m.atrasados.length){add('crit',Math.min(20,10*m.atrasados.length),plural(m.atrasados.length,'conta passou','contas passaram')+' do vencimento ('+brl(sum(m.atrasados,function(i){return i.valor;}))+'). Pagar hoje evita multa e juros.','Abrir checklist','checklist');}
  if(m.prevEnt+m.prevSai>0&&m.sobraPrev<0){add('warn',20,'Pelo que está previsto, '+compLabel(m.c)+' fecha '+brl(-m.sobraPrev)+' no negativo. Vale olhar quais despesas dá para adiar ou reduzir.','Ver despesas','cadastro:despesas');}
  if(m.sai>m.ent&&m.sai>0&&m.ent>0){add('warn',10,'Até agora, neste mês, saiu '+brl(m.sai-m.ent)+' a mais do que entrou.','Ver lançamentos','lancamentos');}
  m.cartoes.forEach(function(x){x.rc.parciais.forEach(function(f){add('crit',15,'Faltou pagar '+brl(f.restante)+' da fatura do '+x.c.nome+(f.venc<hoje()?' que venceu em ':' que vence em ')+dataBR(f.venc)+'. O que fica sem pagar entra no rotativo, um dos juros mais caros que existem.','Ver checklist','checklist');});
    if(!Number(x.c.dia_vencimento))it.push({nivel:'info',pen:0,tx:'Complete o cartão '+x.c.nome+': dia de vencimento e limite. Sem isso, o Rummo não monta as faturas.',acao:'Completar',view:'cadastro:contas'});});
  var lc=Number(P.limite_cartao)||70,alto=m.cartoes.filter(function(x){return Number(x.c.limite)>0&&x.uso/Number(x.c.limite)*100>=lc;});
  if(alto.length){var x=alto[0];add('warn',10,'O cartão '+x.c.nome+' está em '+Math.round(x.uso/x.c.limite*100)+'% do limite. Segure compras não planejadas até a fatura fechar.','Ver contas','cadastro:contas');}
  if(m.mesesReserva!==null){
    if(m.mesesReserva<1)add('warn',15,'Sua reserva cobre menos de 1 mês dos gastos essenciais. Construir essa proteção vem logo depois das dívidas caras.','Ver reserva','cadastro:investimentos');
    else if(m.mesesReserva<(Number(P.meses_reserva)||6))add('info',5,'Sua reserva cobre '+String(m.mesesReserva).replace('.',',')+' meses de gastos essenciais. A meta é '+(Number(P.meses_reserva)||6)+'.','Ver reserva','cadastro:investimentos');
  }
  var lp=Number(P.limite_parcelas)||30;
  if(m.renda>0&&m.parcelas/m.renda*100>lp)add('warn',10,'As parcelas comprometem '+Math.round(m.parcelas/m.renda*100)+'% da sua renda. Acima de '+lp+'%, qualquer imprevisto aperta.','Ver dívidas','cadastro:dividas');
  live('dividas').filter(function(d){return isGar(d)&&d.em_atraso&&dividaAtiva(d);}).slice(0,1).forEach(function(d){add('crit',15,'O financiamento '+d.credor+' está em atraso. Com bem em garantia, esse vem antes de qualquer outra dívida.','Ver dívidas','dividas');});
  var minEx=Number(P.minimo_existencial)||600,essD=sum(live('despesas').filter(function(d){return d.classificacao==='essencial';}),function(d){return d.frequencia==='anual'?(Number(d.valor)||0)/12:d.valor;});
  if(m.renda>0&&m.parcelas>0&&essD+m.parcelas>m.renda-minEx)add('crit',15,'Contas essenciais e parcelas passam do que a sua renda aguenta. Pode ser caso de superendividamento, que tem lei própria para renegociar tudo junto.','Ver caminhos','dividas');
  var nNeg=live('dividas').filter(function(d){return isNeg(d)&&!d.quitada_em;}).length;
  if(nNeg)it.push({nivel:'info',pen:0,tx:plural(nNeg,'dívida está','dívidas estão')+' no seu nome. A Trilha do nome limpo mostra a ordem e o momento certo de negociar.',acao:'Abrir trilha',view:'dividas'});
  if(m.semReg.length>=3)add('info',5,'Há '+plural(m.semReg.length,'dia','dias')+' sem registro. A nota fica mais confiável com os dias em dia.',null,null);
  var nid=sum(lancVis().filter(function(l){return l.nao_identificado&&l.tipo==='saida'&&compOf(l.data)===m.c;}),function(l){return l.valor;});
  if(nid>0)it.push({nivel:'warn',pen:0,tx:'Neste mês, '+brl(nid)+' saíram das suas contas sem explicação. Conferir o saldo com mais frequência ajuda a lembrar para onde foi o dinheiro.',acao:'Ver lançamentos',view:'lancamentos'});
  if(m.naoPlan>0)it.push({nivel:'info',pen:0,tx:'Neste mês, '+brl(m.naoPlan)+' foram em compras não planejadas.',acao:'Ver lançamentos',view:'lancamentos'});
  return {nota:Math.max(0,Math.min(100,Math.round(nota))),it:it,m:m};
}
function diasSemRegistro(){
  var ini=S.meta.inicio,h=hoje(),out=[];
  for(var i=1;i<=14;i++){
    var d=addDays(h,-i);if(d<ini)break;
    var tem=live('carimbos').some(function(c){return c.data===d;})||live('lancamentos').some(function(l){return l.data===d||l.dia_registro===d;});
    if(!tem)out.push(d);
  }
  return out.reverse();
}
function carimbarHoje(){
  var d=hoje(),id='C-'+d,dg=diagnostico(),c=byId('carimbos',id)||{id:id,criado_em:nowIso()};
  var ln=live('lancamentos').filter(function(l){return l.dia_registro===d;});
  c.data=d;c.hora=agoraHora();c.sem_movimento=false;c.revisado=true;c.excluido=false;
  c.lancamentos_n=ln.filter(function(l){return !l.previsto_ref;}).length;
  c.pagos_n=ln.filter(function(l){return !!l.previsto_ref;}).length;
  c.conferencias_n=live('conferencias').filter(function(x){return x.data===d;}).length;
  c.saldo=dg.m.disp;c.nota=dg.nota;c.alertas_n=dg.it.filter(function(i){return i.nivel!=='info';}).length;
  var partes=[];
  if(c.lancamentos_n)partes.push(plural(c.lancamentos_n,'lançamento','lançamentos'));
  if(c.pagos_n)partes.push(plural(c.pagos_n,'conta marcada','contas marcadas'));
  if(c.conferencias_n)partes.push(plural(c.conferencias_n,'saldo conferido','saldos conferidos'));
  c.resumo=partes.length?partes.join(', '):'Revisão das finanças';
  c.atualizado_em=nowIso();
  if(!S.carimbos.some(function(x){return x.id===id;}))S.carimbos.push(c);
}
function sequencia(){
  var d=hoje(),n=0,set={};
  live('carimbos').forEach(function(c){set[c.data]=1;});
  live('lancamentos').forEach(function(l){if(l.dia_registro)set[l.dia_registro]=1;});
  if(!set[d])d=addDays(d,-1);
  while(set[d]){n++;d=addDays(d,-1);}
  return n;
}
function constancia(){
  var h=hoje(),c=compOf(h),ini=S.meta.inicio>c+'-01'?S.meta.inicio:c+'-01';

  live('carimbos').forEach(function(x){if(x.data>=ini&&x.data<=h)set[x.data]=1;});
  var n=Object.keys(set).length;
  return {n:n,dias:dias,p:dias>0?Math.round(n/dias*100):0};
}

function linhaRumo(){

function resumoRec(col,r){
  switch(col){
    case 'contas':var s=saldoConta(r);return [r.nome,TIPO_CONTA[r.tipo]+(r.titular==='negocio'?' · negócio':''),r.tipo==='cartao'?'Fatura '+brl(Math.max(0,-s)):brl(s)];
    case 'receitas':return [r.descricao,(r.frequencia==='anual'?'Anual, em '+MESES[(Number(r.mes)||1)-1]:'Todo dia '+(r.dia||'–'))+' · '+(r.categoria||''),brl(r.valor)];
    case 'despesas':return [r.descricao,(r.frequencia==='anual'?'Anual':'Dia '+(r.dia||'–'))+' · '+(CLASSIF[r.classificacao]||'')+(r.assinatura?' · assinatura':'')+' · corte com impacto '+(IMPACTO[r.impacto_corte]||'').toLowerCase(),brl(r.valor)];
    case 'dividas':if(isNeg(r))return [r.credor,r.tipo+(r.vencimento_original?' · sai do cadastro em '+compLabel(compOf(addYears(r.vencimento_original,5))):'')+(r.quitada_em?' · quitada':''),brl(r.saldo_devedor)];var inf=infoDivida(r);if(r.quitada_em)return [r.credor,r.tipo+' · quitada em '+dataBR(r.quitada_em),'–'];return [r.credor,r.tipo+(inf.fim?' · faltam '+inf.restantes+' de '+inf.total+' · termina em '+compLabel(inf.fim):' · sem prazo definido')+(r.juros_mes?' · '+String(r.juros_mes).replace('.',',')+'% a.m.':''),brl(r.parcela)+'/mês'];
    case 'investimentos':return [r.nome,(r.tipo||'')+' · '+(r.instituicao||'')+' · liquidez '+(r.liquidez||'').toLowerCase(),brl(r.saldo)];
    case 'metas':var g=sum(live('investimentos').filter(function(i){return i.meta_id===r.id;}),function(i){return i.saldo;});return [r.nome,(r.prazo?'Até '+compLabel(r.prazo):'Sem prazo')+' · '+(Number(r.valor)>0?Math.round(g/r.valor*100):0)+'% guardado',brl(r.valor)];
  }
  return [r.id,'',''];
}

function fld(k,l,t,v,o){
  o=o||{};var id='f_'+k,inp;
  var val=(v===undefined||v===null)?'':v;
  if(t==='money')inp='<input id="'+id+'" name="'+k+'" inputmode="decimal" autocomplete="off" value="'+(val!==''?esc(fmtNum(val)):'')+'" placeholder="'+esc(o.ph||'0,00')+'">';
  else if(t==='int')inp='<input id="'+id+'" name="'+k+'" inputmode="numeric" autocomplete="off" value="'+esc(val)+'" placeholder="'+esc(o.ph||'')+'">';
  else if(t==='num')inp='<input id="'+id+'" name="'+k+'" inputmode="decimal" autocomplete="off" value="'+esc(String(val).replace('.',','))+'" placeholder="'+esc(o.ph||'')+'">';
  else if(t==='date')inp='<input id="'+id+'" name="'+k+'" type="date" value="'+esc(val)+'">';
  else if(t==='month')inp='<input id="'+id+'" name="'+k+'" type="month" value="'+esc(val)+'" placeholder="2026-10">';
  else if(t==='select'){var op=typeof o.opt==='function'?o.opt():(o.opt||[]);inp='<select id="'+id+'" name="'+k+'">'+op.map(function(x){return '<option value="'+esc(x[0])+'"'+(String(x[0])===String(val)?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select>';}
  else if(t==='bool')return '<div class="fld'+(o.full?' full':'')+'" data-k="'+k+'"'+(o.hide?' hidden':'')+'><label class="switch"><input type="checkbox" name="'+k+'"'+(val?' checked':'')+'> '+esc(l)+(o.g?' '+gBtn(o.g):'')+'</label>'+(o.help?'<small>'+esc(o.help)+'</small>':'')+'</div>';
  else inp='<input id="'+id+'" name="'+k+'" autocomplete="off" value="'+esc(val)+'" placeholder="'+esc(o.ph||'')+'">';
  return '<div class="fld'+(o.full?' full':'')+(o.big?' big':'')+'" data-k="'+k+'"'+(o.hide?' hidden':'')+'><label for="'+id+'">'+esc(l)+(o.g?' '+gBtn(o.g):'')+'</label>'+inp+(o.help?'<small>'+esc(o.help)+'</small>':'')+'</div>';
}
function lerForm(form,tipos){
  var o={};
  form.querySelectorAll('input[name],select[name]').forEach(function(el){
    var k=el.name,t=tipos[k]||tipoCampo(k);
    if(el.type==='checkbox')o[k]=el.checked;
    else if(t==='money')o[k]=el.value.trim()===''?'':parseMoney(el.value);
    else if(t==='int')o[k]=el.value.trim()===''?'':parseInt(el.value,10)||'';
    else if(t==='num')o[k]=el.value.trim()===''?'':parseMoney(el.value);
    else o[k]=el.value.trim();
  });
  return o;
}
function erro(form,k,msg){

  var e=f.querySelector('.err');if(!e){e=document.createElement('div');e.className='err';f.appendChild(e);}

}

function modalRec(col,id){
  var sc=SCHEMA[col],r=id?JSON.parse(JSON.stringify(byId(col,id))):Object.assign({},DEFAULTS[col]||{});
  if(col==='dividas'&&!id)r.competencia_base=compAtual();
  if(ehCasal()&&!id&&!r.de_quem)r.de_quem=visao()!=='tudo'?visao():(col==='receitas'||col==='contas'?(lerEu()||'A'):'casa');
  if(col==='contas'&&!r.data_saldo)r.data_saldo=hoje();
  var dataAnt=r.data_saldo;
  if(col==='contas'){r.negativo=Number(r.saldo_inicial)<0&&r.tipo!=='cartao';if(r.negativo)r.saldo_inicial=Math.abs(Number(r.saldo_inicial));}
  var tipos={};sc.fields.forEach(function(f){tipos[f.k]=f.t;});
  function corpo(rr){return sc.fields.map(function(f){return fld(f.k,f.lab?f.lab(rr):f.l,f.t,rr[f.k],{opt:f.opt,ph:f.ph,help:f.help,g:f.g,hide:f.show&&!f.show(rr),full:f.t==='bool'});}).join('');}
  var anterior=id?Number(r.saldo_inicial):null;
  abrirModal({titulo:(id?'Editar ':'Nova ')+sc.sing,corpo:corpo(r),
    onChange:function(form){
      var v=lerForm(form,tipos);
      sc.fields.forEach(function(f){var el=form.querySelector('[data-k="'+f.k+'"]');if(!el)return;if(f.show)el.hidden=!f.show(v);if(f.lab){var lb=el.querySelector('label');if(lb)lb.firstChild.textContent=f.lab(v);}});
    },
    onSalvar:function(form){
      limparErros(form);var v=lerForm(form,tipos),ok=true;
      sc.fields.forEach(function(f){if(f.req&&ok&&(v[f.k]===''||v[f.k]===0&&f.t==='money')){erro(form,f.k,'Preencha este campo.');ok=false;}});
      if(!ok)return false;
      if(col==='contas'&&v.tipo==='cartao'&&!(v.dia_vencimento>0)){erro(form,'dia_vencimento','Informe o dia de vencimento da fatura.');return false;}
      ['dia','dia_vencimento','dia_fechamento'].forEach(function(k){if(v[k]!==''&&v[k]!==undefined&&(v[k]<1||v[k]>31)){erro(form,k,'Use um dia entre 1 e 31.');ok=false;}});
      if(!ok)return false;
      if(col==='dividas'){
        if(ehCasal()&&isNeg(v)&&v.de_quem==='casa'){erro(form,'de_quem','Negativação é sempre no CPF de alguém. Escolha de quem é.');return false;}
        if(isNeg(v)){
          if(!(v.saldo_devedor>0)){erro(form,'saldo_devedor','Informe o valor cobrado hoje.');return false;}
          v.parcelas_restantes='';v.competencia_base='';v.em_atraso=true;
        } else {
          if(!(v.parcela>0)){erro(form,'parcela','Informe o valor da parcela ou quanto paga por mês.');return false;}
          if(!v.parcelas_restantes&&!(v.saldo_devedor>0)){erro(form,'saldo_devedor','Sem número de parcelas, informe o saldo devedor para o Rummo saber o tamanho da dívida.');return false;}
        }
        if(!id&&v.competencia_base===compAtual()&&v.dia_vencimento&&v.dia_vencimento<Number(hoje().slice(8)))v.competencia_base=addMonths(compAtual(),1);
      }
      if(col==='contas'){var neg=v.tipo!=='cartao'&&(v.negativo||Number(v.saldo_inicial)<0);v.saldo_inicial=v.saldo_inicial===''?'':(neg?-Math.abs(Number(v.saldo_inicial)):Math.abs(Number(v.saldo_inicial)));if(v.tipo!=='corrente'){v.limite_cheque='';v.juros_cheque='';}}
      var rec=Object.assign(r,v);delete rec.negativo;
      if(col==='contas'&&(!id||Number(v.saldo_inicial)!==anterior||v.data_saldo!==dataAnt)){rec.data_saldo=v.data_saldo&&v.data_saldo<=hoje()?v.data_saldo:hoje();rec.saldo_definido_em=nowIso();}
      if(col==='investimentos'&&!rec.atualizado_comp)rec.atualizado_comp='';
      salvarRec(col,rec);fecharModal();commit((id?'Alterações salvas':sc.sing.charAt(0).toUpperCase()+sc.sing.slice(1)+' adicionada'));
    },
    onExcluir:id?function(){if(confirm('Excluir '+sc.sing+'? Os lançamentos já feitos continuam no histórico.')){excluirRec(col,id);fecharModal();commit('Excluído');}}:null});
}

function serialParaData(v){var d=XLSX.SSF.parse_date_code(v);return d?d.y+'-'+pad(d.m)+'-'+pad(d.d):'';}
function normalizar(row){
  var o={};
  Object.keys(row).forEach(function(k){
    var v=row[k],t=tipoCampo(k);
    if(v===''||v===null||v===undefined){o[k]=t==='bool'?false:'';return;}
    if(t==='money'||t==='num')o[k]=typeof v==='number'?r2(v):parseMoney(v);
    else if(t==='int')o[k]=parseInt(v,10);
    else if(t==='bool')o[k]=v===true||v===1||/^(true|sim|verdadeiro|1|x)$/i.test(String(v).trim());
    else if(t==='date')o[k]=typeof v==='number'?serialParaData(v):String(v).slice(0,10);
    else if(t==='month')o[k]=typeof v==='number'?serialParaData(v).slice(0,7):String(v).slice(0,7);
    else o[k]=String(v);
  });
  return o;
}
function lerArquivo(file){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        var meta=wb.Sheets._meta?XLSX.utils.sheet_to_json(wb.Sheets._meta)[0]:null;
        if(!meta||meta.app!==APP)throw new Error('Este arquivo não é uma planilha do Rummo.');
        if(Number(meta.versao_esquema)>VERSAO)throw new Error('Esta planilha foi criada por uma versão mais nova do Rummo. Atualize o arquivo do Rummo.');
        var inc={meta:meta};
        COLS.forEach(function(c){var ws=wb.Sheets[ABAS[c]];inc[c]=ws?XLSX.utils.sheet_to_json(ws,{defval:''}).map(normalizar):[];});
        var pw=wb.Sheets.Premissas;inc.premissas=pw?normalizar(XLSX.utils.sheet_to_json(pw,{defval:''})[0]||{}):null;
        res(inc);
      }catch(e){rej(e);}
    };
    rd.onerror=function(){rej(new Error('Não consegui ler o arquivo.'));};
    rd.readAsArrayBuffer(file);
  });
}
function vazio(){return COLS.every(function(c){return !S[c].length;});}
function igual(a,b){
  var ks={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ks[k]=1;});
  return Object.keys(ks).every(function(k){var x=a[k],y=b[k];if(x===undefined)x='';if(y===undefined)y='';if(typeof x==='boolean'||typeof y==='boolean')return !!x===!!y;return String(x)===String(y);});
}
function mesclar(inc){
  var base=[S.meta.ultima_exportacao,S.meta.ultima_importacao].filter(Boolean).sort().pop()||'';
  var res={novos:0,atualizados:0,iguais:0,conflitos:[]};
  COLS.forEach(function(c){
    (inc[c]||[]).forEach(function(imp){
      if(!imp.id){imp.id=uid('XL');imp.criado_em=imp.atualizado_em=nowIso();imp.excluido=false;S[c].push(imp);res.novos++;return;}
      if(!imp.atualizado_em)imp.atualizado_em=nowIso();
      var i=S[c].findIndex(function(r){return r.id===imp.id;});
      if(i<0){S[c].push(imp);res.novos++;return;}
      var loc=S[c][i];
      if(igual(loc,imp)){res.iguais++;return;}
      var la=loc.atualizado_em||'',ia=imp.atualizado_em||'';
      if(c==='carimbos'||c==='retratos'){if(ia>la)S[c][i]=imp;res.iguais++;return;}
      if(base&&la>base&&ia>base){res.conflitos.push({c:c,i:i,loc:loc,imp:imp});return;}
      if(ia>la){S[c][i]=imp;res.atualizados++;}else res.iguais++;
    });
  });
  if(inc.premissas&&inc.premissas.id&&(inc.premissas.atualizado_em||'')>(S.premissas.atualizado_em||''))S.premissas=Object.assign(premissasPadrao(),inc.premissas);
  if(inc.meta&&inc.meta.inicio&&inc.meta.inicio<S.meta.inicio)S.meta.inicio=inc.meta.inicio;
  return res;
}
function importar(file){
  lerArquivo(file).then(function(inc){
    var tipoArq=inc.meta.espaco_tipo||'individual',tipoAqui=ehCasal()?'casal':'individual';
    if(tipoArq!==tipoAqui){
      if(!confirm('Este arquivo é do '+(tipoArq==='casal'?'Rummo do casal':'Meu Rummo')+'. Abrir esse espaço e importar lá?'))return;
      trocarEspaco(tipoArq==='casal'?'casal':'principal');
    }
    if(ehCasal()&&!vazio()&&inc.meta.espaco_id&&S.meta.espaco_id&&inc.meta.espaco_id!==S.meta.espaco_id){toast('Este arquivo é de outro Rummo do casal. Nada foi importado.');return;}
    if(vazio()){
      if(inc.meta.espaco_id)S.meta.espaco_id=inc.meta.espaco_id;S.meta.espaco_tipo=tipoArq;
      COLS.forEach(function(c){S[c]=inc[c];});
      if(inc.premissas&&inc.premissas.id)S.premissas=Object.assign(premissasPadrao(),inc.premissas);
      if(inc.meta.inicio)S.meta.inicio=inc.meta.inicio;
      S.meta.onboarding_ok=true;S.meta.ultima_importacao=nowIso();
      $('#onb').innerHTML='';commit('Planilha importada. Bem-vindo de volta.');if(ehCasal())modalEu();return;
    }
    var res=mesclar(inc);
    if(res.conflitos.length){resolverConflitos(res);return;}
    S.meta.ultima_importacao=nowIso();
    commit('Importação concluída: '+plural(res.novos,'novo','novos')+', '+plural(res.atualizados,'atualizado','atualizados')+'.');
  }).catch(function(e){toast(e.message);});
}
function descConflito(c,r){

    onSalvar:function(form){

var BASE_LEGAL='setembro de 2026';
function addYears(ds,n){var p=ds.split('-');var y=Number(p[0])+n;var mm=p[1],dd=p[2];if(mm==='02'&&dd==='29')dd='28';return y+'-'+mm+'-'+dd;}
function addDiasUteis(ds,n){var d=ds;while(n>0){d=addDays(d,1);var w=new Date(d+'T12:00:00').getDay();if(w!==0&&w!==6)n--;}return d;}
function mesesAte(ds){return monthsBetween(compAtual(),compOf(ds));}

/* ---------- base do plano ---------- */
function gastoVariavel(){
  var c=compAtual(),P=S.premissas,vals=[];
  for(var k=1;k<=3;k++){
    var cp=addMonths(c,-k);
    if(cp+'-01'<S.meta.inicio)break;
    vals.push(sum(lancVis().filter(function(l){return l.tipo==='saida'&&!l.previsto_ref&&!l.grupo_parcela&&compOf(l.data)===cp;}),function(l){return l.valor;}));
  }
  if(vals.length)return {valor:r2(sum(vals)/vals.length),fonte:'media',n:vals.length};
  if(visao()==='A'||visao()==='B')return {valor:0,fonte:'nenhuma',n:0};
  if(Number(P.gasto_variavel)>0)return {valor:Number(P.gasto_variavel),fonte:'premissa',n:0};
  return {valor:0,fonte:'nenhuma',n:0};
}
function planoBase(){
  var m=calc(),P=S.premissas,c=m.c;
  var desp=live('despesas');
  var essenciais=r2(sum(desp.filter(function(d){return d.classificacao==='essencial';}),mensalizar));
  var outras=r2(sum(desp.filter(function(d){return d.classificacao!=='essencial';}),mensalizar));
  var pc=sum(lancVis().filter(function(l){return l.grupo_parcela&&l.tipo==='saida'&&compOf(l.data)===c;}),function(l){return l.valor;});
  var gv=gastoVariavel();
  var semPrazo=r2(sum(live('dividas').filter(function(d){return !isNeg(d)&&dividaAtiva(d)&&!(Number(d.parcelas_restantes)>0);}),function(d){return d.parcela;}));
  var parcelasTot=r2(m.parcelas+semPrazo);
  var ctb=ehCasal()?contribCasal(c):null,contrib=(ctb&&ctb.modo!=='junto'&&(visao()==='A'||visao()==='B'))?(visao()==='A'?ctb.a:ctb.b):0;
  var sobra=r2(m.renda-essenciais-outras-parcelasTot-pc-gv.valor-contrib);
  var base=r2(essenciais+parcelasTot);
  var colAlvo=Number(P.colchao_minimo)>0?Number(P.colchao_minimo):(base>0?base:1000);
  var resAlvo=r2((Number(P.meses_reserva)||6)*base);
  var pl=Number(P.pct_livre);if(isNaN(pl)||P.pct_livre==='')pl=10;
  var livre=sobra>0?r2(sobra*pl/100):0;
  var minEx=Number(P.minimo_existencial)||600;
  return {m:m,contrib:contrib,renda:m.renda,essenciais:essenciais,outras:outras,parcelas:parcelasTot,semPrazo:semPrazo,parcelasCartao:pc,gv:gv,sobra:sobra,livre:livre,disponivel:r2(Math.max(0,sobra-livre)),
    colAlvo:r2(colAlvo),resAlvo:resAlvo,reserva:m.reserva,colchaoOk:m.reserva>=colAlvo,minEx:minEx,
    superendividado:m.renda>0&&(essenciais+parcelasTot+pc)>(m.renda-minEx)&&parcelasTot>0,folga:folgaDoMes(m,gv)};
}

function folgaDoMes(m,gv){
  var h=hoje(),c=compOf(h),p=c.split('-').map(Number),dm=new Date(p[0],p[1],0).getDate(),resta=dm-Number(h.slice(8));

  var sai=sum(pend.filter(function(i){return i.tipo==='saida';}),function(i){return i.valor;});

/* ---------- negativadas ---------- */
function analiseNeg(d,b){
  var a={d:d,v:Number(d.saldo_devedor)||0,orig:Number(d.valor_original)||0};
  var h=hoje();
  if(d.vencimento_original){a.sai=addYears(d.vencimento_original,5);a.meses=mesesAte(a.sai);a.jaSaiu=a.sai<=h;}
  var av=Number(d.proposta_avista)||0,en=Number(d.proposta_entrada)||0,np=Number(d.proposta_parcelas)||0,vp=Number(d.proposta_valor_parcela)||0;
  if(av>0){a.avista=av;a.descAvista=a.v>0?Math.max(0,Math.round((1-av/a.v)*100)):null;}
  if(np>0&&vp>0){a.parc={entrada:en,n:np,vp:vp,total:r2(en+np*vp)};a.descParc=a.v>0?Math.round((1-a.parc.total/a.v)*100):null;a.acimaParc=a.v>0&&a.parc.total>a.v?r2(a.parc.total-a.v):0;
    if(av>0)a.extraParcelar=r2(a.parc.total-av);}
  a.cabeParc=a.parc?a.parc.vp<=b.disponivel*0.5:null;
  a.cabeAvista=av>0?b.folga>=av:null;
  var duros=[],leves=[];
  if(b.sobra<=0)duros.push('o seu mês ainda não fecha no positivo');
  if(b.m.atrasados.length)duros.push('há contas do mês atrasadas');
  if(b.m.caras.length)leves.push('há dívida de juros muito altos para resolver antes');
  if(!b.colchaoOk)leves.push('o colchão mínimo ainda não está formado');
  var bloqueios=duros.concat(leves);a.bloqueios=bloqueios;
  a.oportunidade=!duros.length&&a.avista&&a.descAvista!=null&&a.descAvista>=70&&a.cabeAvista;
  if(a.jaSaiu){a.classe='prescrita';a.rotulo='Provável prescrição';a.nivel='info';
    a.texto='Já se passaram 5 anos do vencimento: o nome saiu do cadastro de inadimplentes. Pelo entendimento mais recente do STJ, a dívida prescrita não pode ser cobrada, mas o tema ainda está em julgamento. Não pague sob pressão; se quiser pagar por outro motivo, avalie com calma.';}
  else if(a.sai&&a.meses<=12){a.classe='avaliar';a.rotulo='Avaliar com calma';a.nivel='warn';
    a.texto='Sai do cadastro sozinha em '+compLabel(compOf(a.sai))+'. Pagar agora só para limpar o nome traz pouco ganho. Pague antes só se precisar do nome limpo antes dessa data ou se o desconto for muito bom e o dinheiro sobrar.';}
  else if(a.oportunidade){a.classe='agora';a.rotulo='Oportunidade';a.nivel='ok';
    a.texto='Desconto de '+a.descAvista+'% e o valor cabe no que sobra este mês, sem mexer nas contas essenciais. Uma proposta assim costuma valer a pena mesmo antes de o colchão estar pronto. Confirme por escrito e veja se ela ainda está válida.';}
  else if(bloqueios.length){a.classe='depois';a.rotulo='Negociar depois';a.nivel='info';
    a.texto='Espere um pouco: '+bloqueios.join('; ')+'. Um acordo assinado sem folga costuma quebrar no primeiro imprevisto e a situação piora.';}
  else if(a.parc&&!a.cabeParc&&!(a.avista&&a.cabeAvista)){a.classe='depois';a.rotulo='Negociar depois';a.nivel='info';
    a.texto='A parcela proposta ('+brl(a.parc.vp)+') passa da metade do que sobra no mês. Peça mais prazo ou um valor menor antes de fechar.';}
  else {a.classe='agora';a.rotulo='Negociar agora';a.nivel='ok';
    a.texto=a.avista&&a.cabeAvista?'Você tem condição de fechar à vista'+(a.descAvista!=null?' com '+a.descAvista+'% de desconto':'')+'. À vista costuma ser o melhor negócio.':
      (a.parc?'A parcela proposta cabe no seu mês com folga.':'Chegou a hora. Consulte a proposta atual no canal oficial do credor e registre aqui para o Rummo avaliar.');}
  var pesoTempo=a.sai?Math.min(1,Math.max(0,a.meses)/60):0.5;
  var desc=(a.descAvista!=null?a.descAvista:(a.descParc!=null?a.descParc:0))/100;
  a.score=pesoTempo*0.5+desc*0.35+(a.v>0?0.15*(1-Math.min(1,a.v/20000)):0);
  if(d.pagamento_baixa_em&&!d.baixa_confirmada){a.baixaPrazo=addDiasUteis(d.pagamento_baixa_em,5);a.baixaAtrasada=h>a.baixaPrazo;a.aguardandoPg=d.pagamento_baixa_em>h;}
  return a;
}

/* ---------- estratégia de dívidas ---------- */
function dividasEstrategia(){
  return live('dividas').filter(function(d){return !isNeg(d)&&dividaAtiva(d);}).map(function(d){
    var inf=infoDivida(d),saldo=Number(d.saldo_devedor)>0?Number(d.saldo_devedor):(inf.restantes!=null?r2(inf.restantes*(Number(d.parcela)||0)):0);
    var semJuros=d.tipo==='Parcelado sem juros'||d.tipo==='Acordo em andamento';
    return {id:d.id,d:d,nome:nomeDiv(d),saldo:saldo,j:Number(d.juros_mes)||0,min:Number(d.parcela)||0,faltaJuros:!semJuros&&!(Number(d.juros_mes)>0),faltaSaldo:!(saldo>0)};
  }).filter(function(x){return x.saldo>0;}).concat(chequesEspeciais().map(function(ce){return {id:ce.d.id,d:ce.d,nome:ce.d.credor,saldo:ce.valor,j:ce.juros,min:0,faltaJuros:false,faltaSaldo:false};}));
}
function simular(ds,extra,modo){
  var arr=ds.map(function(d){return {id:d.id,nome:d.nome,s:d.saldo,j:d.j,min:d.min,fim:null};});
  var mes=0,juros=0,pago=0;
  function ordem(){return arr.filter(function(a){return a.s>0.005;}).sort(modo==='avalanche'?function(x,y){return (y.j-x.j)||(x.s-y.s);}:function(x,y){return (x.s-y.s)||(y.j-x.j);});}
  while(arr.some(function(a){return a.s>0.005;})&&mes<600){
    mes++;
    var sobraMes=extra;
    arr.forEach(function(a){if(a.s>0.005){var jj=a.s*a.j/100;a.s+=jj;juros+=jj;}});
    arr.forEach(function(a){if(a.s>0.005){var p=Math.min(a.s,a.min);a.s-=p;pago+=p;sobraMes+=a.min-p;}else sobraMes+=a.min;});
    ordem().forEach(function(a){if(sobraMes<=0)return;var p=Math.min(a.s,sobraMes);a.s-=p;sobraMes-=p;pago+=p;});
    arr.forEach(function(a){if(a.s<=0.005&&a.fim===null){a.s=0;a.fim=mes;}});
  }
  var ok=!arr.some(function(a){return a.s>0.005;});
  return {ok:ok,meses:mes,juros:r2(juros),fins:arr.map(function(a){return {id:a.id,nome:a.nome,fim:a.fim};}).sort(function(x,y){return (x.fim||999)-(y.fim||999);})};
}
function estrategia(extra){
  var ds=dividasEstrategia();
  if(!ds.length)return null;
  var av=simular(ds,extra,'avalanche'),bn=simular(ds,extra,'bola');
  var faltam=ds.filter(function(x){return x.faltaJuros;});
  var temCara=ds.some(function(x){return DIVIDA_CARA.indexOf(x.d.tipo)>-1;});
  var dif=r2(bn.juros-av.juros),modo,motivo;
  if(temCara){modo='avalanche';motivo='Há dívida de juros muito altos. Cada mês com ela custa caro, por isso ela vem primeiro.';}
  else if(faltam.length){modo='avalanche';motivo='Faltam os juros de '+plural(faltam.length,'dívida','dívidas')+'. Com os juros informados, o Rummo compara o custo real das duas estratégias.';}
  else if(dif<=Math.max(150,av.juros*0.05)){modo='bola';motivo='A diferença de custo é pequena ('+brl(Math.max(0,dif))+'). Quitar primeiro as menores dá vitórias rápidas, e a motivação vale mais que essa diferença.';}
  else {modo='avalanche';motivo='Atacar primeiro os juros mais altos economiza '+brl(dif)+' em relação à bola de neve.';}
  var esc=modo==='avalanche'?av:bn;
  var ordem=ds.slice().sort(modo==='avalanche'?function(x,y){return (y.j-x.j)||(x.saldo-y.saldo);}:function(x,y){return (x.saldo-y.saldo)||(y.j-x.j);});
  return {ds:ds,av:av,bn:bn,modo:modo,motivo:motivo,esc:esc,ordem:ordem,alvo:ordem[0],faltam:faltam,dif:dif,extra:extra};
}

  var poolDiv=0;

    m.ces.forEach(function(ce){poolDiv+=dar('cara',ce.valor,'Deixar na conta '+ce.c.nome+' para sair do negativo','Enquanto a conta estiver no cheque especial, cada real que fica nela deixa de pagar juros de '+String(ce.juros).replace('.',',')+'% ao mês'+(ce.estimado?' (estimativa)':'')+'. Não mova dinheiro para guardar enquanto ela estiver no vermelho.',{d:ce.d});});
    caras=caras.filter(function(x){return !x.d.virtual;});
    if(caras.length&&falta>0){

      poolDiv+=dar('cara',R,'Extra para '+nomeDiv(caras[0].d),'Dívida de juros muito altos: cada real a mais aqui é juro que você deixa de pagar.',{d:caras[0].d});
    } else {
      if(falta>0)dar('colchao',falta,'Guardar no colchão','Faltam '+brl(falta)+' para o colchão mínimo. Ele vem antes de novos acordos, porque protege os que você já tem.');
      if(caras.length)poolDiv+=dar('cara',R,'Extra para '+nomeDiv(caras[0].d),'Juros muito altos: a prioridade é tirar essa dívida da sua vida.',{d:caras[0].d});

      else if(a.avista)dar('neg',a.avista,'Juntar para quitar à vista: '+nomeDiv(a.d),'À vista costuma ter o maior desconto'+(a.descAvista!=null?' ('+a.descAvista+'%)':'')+'.',{d:a.d});
    });

    if(est0&&est0.alvo&&est0.alvo.j>=1.5&&!(caras.length&&DIVIDA_CARA.indexOf(est0.alvo.d.tipo)>-1))poolDiv+=dar('extra',R,'Adiantar a dívida '+est0.alvo.nome,'Estratégia '+(est0.modo==='avalanche'?'avalanche':'bola de neve')+': é a próxima da fila.',{d:est0.alvo.d});
    if(b.resAlvo>0&&b.reserva<b.resAlvo)dar('reserva',Math.min(R,b.resAlvo-b.reserva),'Completar a reserva de emergência','A meta é '+(Number(S.premissas.meses_reserva)||6)+' meses dos gastos essenciais ('+brl(b.resAlvo)+').');
    live('metas').filter(function(mt){return Number(mt.valor)>0;}).sort(function(x,y){var o={alta:0,media:1,baixa:2};return (o[x.prioridade]||1)-(o[y.prioridade]||1)||String(x.prazo||'9').localeCompare(String(y.prazo||'9'));}).forEach(function(mt){
      var g=sum(live('investimentos').filter(function(i){return i.meta_id===mt.id;}),function(i){return i.saldo;}),rest=Math.max(0,mt.valor-g);if(!rest)return;
      var n=mt.prazo?Math.max(1,monthsBetween(compAtual(),mt.prazo)):12;
      dar('meta',Math.min(rest,r2(rest/n)),'Guardar para a meta '+mt.nome,mt.prazo?'Para chegar lá até '+compLabel(mt.prazo)+'.':'Sem prazo definido: o Rummo sugere 12 meses.');
    });
    if(R>0)dar('investir',R,'Investir para o longo prazo','Com o básico protegido, o que sobra trabalha para o seu futuro.');
  }
  var est=estrategia(poolDiv);
  return {b:b,dest:dest,negs:negs,est:est,livre:b.livre};
}
function cortesSugeridos(falta){

function contribCasal(c){
  if(!ehCasal())return null;
  var P=S.premissas;
  var fixas=r2(sum(liveAll('despesas').filter(function(d){return donoRec('despesas',d)==='casa';}),mensalizar));
  var parc=0;
  liveAll('dividas').filter(function(d){return donoRec('dividas',d)==='casa'&&dividaAtiva(d)&&!isNeg(d);}).forEach(function(d){
    var n=Number(d.parcelas_restantes)||0;if(!n){parc+=Number(d.parcela)||0;return;}
    var k=monthsBetween(d.competencia_base,c);if(k>=0&&k<n)parc+=Number(d.parcela)||0;
  });
  var contasCasa=liveAll('contas').filter(function(x){return donoRec('contas',x)==='casa';});
  var vals=[];
  for(var k=1;k<=3;k++){
    var cp=addMonths(c,-k);if(cp+'-01'<S.meta.inicio)break;
    vals.push(sum(liveAll('lancamentos').filter(function(l){return l.tipo==='saida'&&!l.previsto_ref&&compOf(l.data)===cp&&contasCasa.some(function(x){return x.id===l.conta_id;});}),function(l){return l.valor;}));
  }
  var dia=vals.length?r2(sum(vals)/vals.length):(Number(P.gasto_variavel)||0);
  var total=r2(fixas+parc+dia);
  var rA=sum(liveAll('receitas').filter(function(r){return r.de_quem==='A';}),mensalizar),rB=sum(liveAll('receitas').filter(function(r){return r.de_quem==='B';}),mensalizar);
  var modo=P.casal_divisao||'proporcional',pA=modo==='meio'?0.5:(rA+rB>0?rA/(rA+rB):0.5);

  return {total:total,fixas:fixas,parc:r2(parc),dia:dia,diaFonte:vals.length?'media':'informado',rA:r2(rA),rB:r2(rB),modo:modo,pA:pA,a:a,b:r2(total-a),
    contaCasa:contasCasa.find(function(x){return x.tipo!=='cartao';})||null};
}

}

function fmtK(v){var a=Math.abs(v),s=v<0?'−':'';return a>=1000?s+'R$ '+(a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':s+'R$ '+Math.round(a);}
function graficoEvolucao(rs){
  var W=640,H=210,P={l:64,r:16,t:14,b:30},series=[{k:'patrimonio',nome:'Patrimônio',cor:'var(--okbar)'},{k:'divida_total',nome:'Dívidas',cor:'var(--critbar)'}];
  var vals=[0];rs.forEach(function(r){series.forEach(function(s){vals.push(Number(r[s.k])||0);});});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx===mn)mx=mn+1;

  if(mn<0&&mx>0)g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>';

  series.forEach(function(s){

    if(rs.length>1)g+='<polyline points="'+pts+'" fill="none" stroke="'+s.cor+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

  });

/* ---------- lembretes na agenda (.ics) ---------- */
function icsEsc(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function icsDia(ds){return ds.replace(/-/g,'');}
function regraMensal(d){d=Math.max(1,Math.min(31,Number(d)||1));return 'FREQ=MONTHLY;BYMONTHDAY='+(d===31?-1:d);}
function proximaData(dia){var h=hoje(),d=dateInComp(compAtual(),dia);return d>=h?d:dateInComp(addMonths(compAtual(),1),dia);}
function gerarICS(){
  var P=S.premissas,det=!!P.lembrete_detalhes,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rummo//Lembretes//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Rummo'];
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'),n=0;
  var eu=lerEu(),meu=function(col,r){return !ehCasal()||!eu||donoRec(col,r)===eu||donoRec(col,r)==='casa';};
  function ev(uid,o){
    n++;L.push('BEGIN:VEVENT','UID:'+uid+'@rummo','DTSTAMP:'+stamp);
    if(o.hora){L.push('DTSTART:'+icsDia(o.data)+'T'+o.hora.replace(':','')+'00','DURATION:PT10M');}
    else L.push('DTSTART;VALUE=DATE:'+icsDia(o.data),'DTEND;VALUE=DATE:'+icsDia(addDays(o.data,1)));
    if(o.rrule)L.push('RRULE:'+o.rrule);
    L.push('SUMMARY:'+icsEsc(o.titulo));
    L.push('DESCRIPTION:'+icsEsc((o.desc?o.desc+'\n':'')+'Abra o Rummo para registrar.'));
    (o.hora?['PT0M']:['-PT15H','PT9H']).forEach(function(t){L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(o.titulo),'TRIGGER:'+t,'END:VALARM');});
    L.push('END:VEVENT');
  }
  if(P.lembrete_diario!==false)ev('diario',{data:hoje(),hora:/^\d{2}:\d{2}$/.test(P.lembrete_hora||'')?P.lembrete_hora:'20:00',rrule:'FREQ=DAILY',titulo:'Rummo: registre o dia',desc:'Lance o que entrou e o que saiu hoje. Leva um minuto.'});
  if(P.lembrete_fim!==false)ev('fim-do-mes',{data:dateInComp(compAtual(),31),rrule:'FREQ=MONTHLY;BYMONTHDAY=-1',titulo:'Rummo: feche o mês',desc:'Confira o checklist, atualize os investimentos e exporte o Excel.'});
  if(P.lembrete_venc!==false){
    liveAll('despesas').filter(function(d){return meu('despesas',d)&&Number(d.dia)>0;}).forEach(function(d){
      var anual=d.frequencia==='anual';
      ev('desp-'+d.id,{data:anual?(function(){var y=Number(hoje().slice(0,4)),c=y+'-'+pad(Number(d.mes)||1),dt=dateInComp(c,d.dia);return dt>=hoje()?dt:dateInComp((y+1)+'-'+pad(Number(d.mes)||1),d.dia);})():proximaData(d.dia),
        rrule:anual?'FREQ=YEARLY;BYMONTH='+(Number(d.mes)||1)+';BYMONTHDAY='+Math.min(28,Number(d.dia)||1):regraMensal(d.dia),
        titulo:det?'Rummo: vence '+d.descricao+' ('+brl(d.valor)+')':'Rummo: conta a vencer hoje'});
    });
    liveAll('dividas').filter(function(d){return meu('dividas',d)&&dividaAtiva(d)&&!isNeg(d)&&Number(d.dia_vencimento)>0;}).forEach(function(d){
      var inf=infoDivida(d),rule=regraMensal(d.dia_vencimento),ini=proximaData(d.dia_vencimento);
      if(inf.fim){var rest=0;for(var c=compOf(ini);c<=inf.fim;c=addMonths(c,1))rest++;if(rest<1)return;rule+=';COUNT='+rest;}
      ev('div-'+d.id,{data:ini,rrule:rule,titulo:det?'Rummo: parcela '+d.credor+' ('+brl(d.parcela)+')':'Rummo: parcela de dívida vence hoje',desc:det&&inf.fim?'Última parcela em '+compLabel(inf.fim)+'.':''});
    });
    liveAll('contas').filter(function(c){return meu('contas',c)&&c.tipo==='cartao'&&Number(c.dia_vencimento)>0;}).forEach(function(c){
      ev('fat-'+c.id,{data:proximaData(c.dia_vencimento),rrule:regraMensal(c.dia_vencimento),titulo:det?'Rummo: fatura '+c.nome+' vence hoje':'Rummo: fatura do cartão vence hoje'});
    });
    pendenciasBaixa().filter(function(x){return !x.atrasada&&meu('dividas',x.d);}).forEach(function(x){
      ev('baixa-'+x.d.id,{data:x.prazo,titulo:'Rummo: confirme se seu nome saiu',desc:'Prazo de 5 dias úteis para o credor pedir a baixa.'});
    });
    if(ehCasal()&&eu){var ct=contribCasal(compAtual());if(ct&&ct.modo!=='junto'&&ct.contaCasa)ev('contrib-'+eu,{data:proximaData(P.casal_dia||5),rrule:regraMensal(P.casal_dia||5),titulo:'Rummo: sua contribuição para a casa',desc:det?'Valor deste mês: '+brl(eu==='A'?ct.a:ct.b)+'.':''});}
  }
  if(P.lembrete_receb){
    liveAll('receitas').filter(function(r){return meu('receitas',r)&&Number(r.dia)>0&&r.frequencia!=='anual';}).forEach(function(r){
      ev('rec-'+r.id,{data:proximaData(r.dia),rrule:regraMensal(r.dia),titulo:det?'Rummo: dia de receber '+r.descricao:'Rummo: confira um recebimento'});
    });
  }
  L.push('END:VCALENDAR');
  return {txt:L.join('\r\n')+'\r\n',n:n};
}

/* =====================================================================
   CARTÃO DE CRÉDITO · ciclo de faturas
   Compra → fatura aberta → fecha (padrão: 5 dias antes do vencimento)
   → vira conta a pagar no vencimento → pagamento libera o limite
   ===================================================================== */
function diasCartao(c){
  var V=Math.min(31,Math.max(1,Number(c.dia_vencimento)||10)),F=Number(c.dia_fechamento);
  if(!(F>=1&&F<=31)){F=V-5;if(F<1)F+=30;}
  return {F:F,V:V,padrao:!(Number(c.dia_fechamento)>=1)};
}
function cicloDe(c,d){
  var k=diasCartao(c),fech=dateInComp(compOf(d),k.F);
  if(d>=fech)fech=dateInComp(addMonths(compOf(d),1),k.F);
  var venc=dateInComp(compOf(fech),k.V);
  if(venc<=fech)venc=dateInComp(addMonths(compOf(fech),1),k.V);
  return {id:compOf(venc),fech:fech,venc:venc};
}
function faturasCartao(c){
  var map={},h=hoje(),d0=c.data_saldo||h,def=c.saldo_definido_em||'';
  function fat(ci){return map[ci.id]||(map[ci.id]={id:ci.id,fech:ci.fech,venc:ci.venc,total:0,compras:0,pago:0});}
  var ab0=cicloDe(c,d0);
  if(Number(c.saldo_inicial))fat(ab0).total+=Math.abs(Number(c.saldo_inicial));
  if(Number(c.fatura_fechada)>0){
    var ultFech=dateInComp(addMonths(compOf(ab0.fech),-1),diasCartao(c).F),ant=cicloDe(c,addDays(ultFech,-1));
    if(ant.venc>=d0)fat(ant).total+=Number(c.fatura_fechada);
  }
  var pagamentos=[];
  liveAll('lancamentos').forEach(function(l){
    if(l.data<d0)return;
    if(l.data===d0&&def&&(l.criado_em||'')<def)return;
    var v=Number(l.valor)||0;if(!v)return;
    if(l.tipo==='saida'&&l.conta_id===c.id){var x=fat(cicloDe(c,l.data));x.total+=v;x.compras++;}
    else if(l.tipo==='entrada'&&l.conta_id===c.id){fat(cicloDe(c,l.data)).total-=v;}
    else if(l.tipo==='transferencia'&&l.conta_destino_id===c.id&&l.data<=h)pagamentos.push(l);
    else if(l.tipo==='transferencia'&&l.conta_id===c.id){var y=fat(cicloDe(c,l.data));y.total+=v;}
  });
  var lista=Object.keys(map).map(function(k){var f=map[k];f.total=r2(f.total);return f;}).sort(function(a,b){return a.venc<b.venc?-1:1;});
  var semRef=[];
  pagamentos.forEach(function(l){
    var pre='F:'+c.id+':';
    if(l.previsto_ref&&l.previsto_ref.indexOf(pre)===0){var alvo=map[l.previsto_ref.slice(pre.length)];if(alvo){alvo.pago=r2(alvo.pago+Number(l.valor));return;}}
    semRef.push(l);
  });
  semRef.sort(function(a,b){return a.data<b.data?-1:1;}).forEach(function(l){
    var v=Number(l.valor)||0;
    lista.forEach(function(f){if(v<=0)return;var falta=r2(f.total-f.pago);if(falta<=0)return;var p=Math.min(falta,v);f.pago=r2(f.pago+p);v=r2(v-p);});
  });
  lista.forEach(function(f){
    f.restante=r2(Math.max(0,f.total-f.pago));
    if(f.total<=0)f.status='zerada';
    else if(f.restante<=0.009)f.status='paga';
    else if(h<f.fech)f.status='aberta';
    else if(h>f.venc)f.status='vencida';
    else f.status='fechada';
  });
  return lista;
}
function resumoCartao(c){
  var fs=faturasCartao(c),h=hoje(),ab=cicloDe(c,h);
  var aberta=fs.find(function(f){return f.id===ab.id;})||{id:ab.id,fech:ab.fech,venc:ab.venc,total:0,restante:0,status:'aberta',pago:0};
  var fechadas=fs.filter(function(f){return (f.status==='fechada'||f.status==='vencida')&&f.restante>0;});
  var usoLimite=r2(sum(fs,function(f){return f.restante;}));
  var devido=r2(sum(fechadas,function(f){return f.restante;})+(aberta.status==='paga'?0:aberta.restante));
  var parciais=fs.filter(function(f){return f.pago>0&&f.restante>0.009&&(f.status==='fechada'||f.status==='vencida');});
  var lim=Number(c.limite)||0;
  return {faturas:fs,aberta:aberta,fechadas:fechadas,usoLimite:usoLimite,devido:devido,parciais:parciais,limite:lim,limiteDisp:lim?r2(lim-usoLimite):null,dias:diasCartao(c)};
}

    var v=lerForm(form,{casal_nome_a:'text',casal_nome_b:'text',casal_divisao:'text',casal_dia:'int',nome:'text',meses_reserva:'int',limite_cartao:'int',limite_parcelas:'int',gasto_variavel:'money',colchao_minimo:'money',pct_livre:'int',minimo_existencial:'money',categorias_despesa:'text',categorias_receita:'text'});
    aplicarTema(v.tema||'auto');delete v.tema;delete v.eu;
    S.premissas=Object.assign(S.premissas,v,{atualizado_em:nowIso()});commit('Preferências salvas');
  },
  reset:function(){
    var r=prompt('Isto apaga todos os dados deste aparelho. Para confirmar, digite APAGAR');
    if(r&&r.trim().toUpperCase()==='APAGAR'){S=novoEstado();persistir();ONB={passo:0,contas:[]};ONBC={passo:0,contas:[]};UI.view='painel';render();if(ehCasal())renderOnbCasal();else renderOnb();toast('Dados apagados deste aparelho');}
  },
  fechar:fecharModal,
  'fechar-ov':function(a,el,e){if(e&&e.target===el)fecharModal();},
  'm-salvar':function(){if(MODAL&&MODAL.onSalvar)MODAL.onSalvar($('#mForm'));},
  'm-excluir':function(){if(MODAL&&MODAL.onExcluir)MODAL.onExcluir();},
  onb:function(p){
    if(ONB.passo===1){var n=$('#onbNome');if(n)S.premissas.nome=n.value.trim();}
    ONB.passo=Number(p);renderOnb();
  },
  'onb-add':function(){
    var f=$('#onbForm');limparErros(f);var v=lerForm(f,{nome:'text',tipo:'text',saldo_inicial:'money'});
    if(!v.nome){erro(f,'nome','Dê um nome para a conta.');return;}
    v.saldo_inicial=sinalSaldo(v);v.titular='pessoal';ONB.contas.push(v);renderOnb();
  },
  'onb-rm':function(i){ONB.contas.splice(Number(i),1);renderOnb();},
  'onb-fim':function(){
    var f=$('#onbForm');if(f){var v=lerForm(f,{nome:'text',tipo:'text',saldo_inicial:'money'});if(v.nome){v.saldo_inicial=sinalSaldo(v);v.titular='pessoal';ONB.contas.push(v);}}
    ONB.contas.forEach(function(c){c.data_saldo=hoje();c.saldo_definido_em=nowIso();salvarRec('contas',c);});
    S.meta.onboarding_ok=true;S.meta.inicio=hoje();S.premissas.atualizado_em=nowIso();
    $('#onb').innerHTML='';UI.view='painel';commit(ONB.contas.length?'Tudo pronto. Agora cadastre o que é fixo: receitas, despesas e dívidas.':'Tudo pronto. Comece cadastrando suas contas.');
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var p=el.dataset.act.split('|'),a=p.shift();
  if(a==='fechar-ov'){if(e.target===el)fecharModal();return;}
  if(!ACT[a])return;
  if(el.tagName==='BUTTON')e.preventDefault();
  ACT[a].apply(null,p.concat([el,e]));
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&MODAL)fecharModal();
  if(e.key==='Enter'&&MODAL&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){e.preventDefault();MODAL.onSalvar&&MODAL.onSalvar($('#mForm'));}
});
$('#fileImp').addEventListener('change',function(e){var f=e.target.files[0];if(f)importar(f);});

/* ---------- início ---------- */
aplicarTema(lerTema());
lerEsp();
carregar();
render();
if(!S.meta.onboarding_ok){if(ehCasal())renderOnbCasal();else renderOnb();}
else if(ehCasal()&&!lerEu())modalEu();
if(S.meta.onboarding_ok){atualizarRetrato();persistir();}
var HOSPEDADO=location.protocol==='https:'||location.hostname==='localhost';
if('serviceWorker' in navigator&&HOSPEDADO){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){reg.update();}).catch(function(){});}
function verificarAtualizacao(manual){
  if(!HOSPEDADO||!window.fetch){UI.versaoStatus='local';if(manual)render();return;}
  UI.versaoStatus='verificando';if(manual)render();
  fetch('versao.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    UI.versaoHora=agoraHora();
    if(j&&j.versao&&j.versao!==VERSAO_ID){UI.novaVersao=j;UI.versaoStatus='nova';}
    else{UI.novaVersao=null;UI.versaoStatus=j?'ok':'erro';}
    render();if(manual&&UI.versaoStatus==='ok')toast('Seu Rummo está atualizado.');
  }).catch(function(){UI.versaoStatus='offline';render();});
}
function linhaVersao(){
  var st=UI.versaoStatus;
  return 'Versão '+VERSAO_ID+(st==='ok'?' · <span class="pos">✓ atualizado</span>':(st==='nova'?' · <button class="lnk" data-act="atualizar-app">atualizar</button>':''));
}
function statusVersao(){
  var st=UI.versaoStatus,b='<b>'+VERSAO_APP+'</b>',btn='<button class="btn sm" data-act="verificar-versao">Verificar agora</button>';
  if(st==='ok')return '<div class="alert ok" style="margin:8px 0 0"><span class="bar"></span><span class="tx">✓ Seu Rummo está atualizado. Versão '+b+(UI.versaoHora?' · verificado às '+UI.versaoHora:'')+'.</span>'+btn+'</div>';
  if(st==='nova')return '<div class="alert warn" style="margin:8px 0 0"><span class="bar"></span><span class="tx">Existe uma versão nova. Você está na versão '+b+'.</span><button class="btn sm pri" data-act="atualizar-app">Atualizar agora</button></div>';
  if(st==='offline'||st==='erro')return '<div class="alert info" style="margin:8px 0 0"><span class="bar"></span><span class="tx">Versão '+b+'. Sem internet para verificar atualizações agora.</span>'+btn+'</div>';
  if(st==='local')return '<div class="alert info" style="margin:8px 0 0"><span class="bar"></span><span class="tx">Versão '+b+'. Aberto como arquivo: atualizações não são automáticas. Para receber as novidades sozinho, use o link do Rummo.</span></div>';
  return '<div class="alert info" style="margin:8px 0 0"><span class="bar"></span><span class="tx">Versão '+b+'. Verificando atualizações…</span></div>';
}
function atualizarApp(){
  persistir();
  var fim=function(){location.replace(location.pathname+'?v='+encodeURIComponent((UI.novaVersao&&UI.novaVersao.versao)||Date.now()));};
  var limpar=function(){return window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}):Promise.resolve();};
  var sw=('serviceWorker' in navigator)?navigator.serviceWorker.getRegistration().then(function(reg){return reg?reg.update():null;}).catch(function(){}):Promise.resolve();
  sw.then(limpar).then(fim,fim);
}
verificarAtualizacao();
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')verificarAtualizacao();});
window.__rumo={verificarAtualizacao:verificarAtualizacao,S:function(){return S;},mesclar:mesclar,montarWB:montarWB,normalizar:normalizar,diagnostico:diagnostico,itensDoMes:itensDoMes,saldoConta:saldoConta,commit:commit,salvarRec:salvarRec,ACT:ACT,lerArquivo:lerArquivo};
})();
